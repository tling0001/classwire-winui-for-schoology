name: Build Schoology WinUI 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and sign MSIX packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Locate Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "Visual Studio Installer vswhere.exe was not found." }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild -or !(Test-Path $msbuild)) { throw "Visual Studio MSBuild was not found." }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $msbuild)
          Write-Host "Using MSBuild: $msbuild"

      - name: Build signed x64 and ARM64 MSIX packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:GITHUB_WORKSPACE "Schoology.WinUI\Schoology.WinUI.csproj"
          $output = Join-Path $env:GITHUB_WORKSPACE "msix-output"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          # Create one short-lived development signing certificate for both architectures.
          # The public .cer is distributed with the MSIX files so users can trust the
          # publisher before installing. The private key never leaves this runner.
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Output "::add-mask::$password"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $certificate = New-SelfSignedCertificate -Type Custom -Subject "CN=Schoology" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:RUNNER_TEMP "Schoology-MSIX-Signing.pfx"
          Export-PfxCertificate -Cert $certificate -FilePath $pfx -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath (Join-Path $output "Schoology-MSIX-Signing.cer") | Out-Null

          foreach ($target in @(@{ Architecture = "x64"; Rid = "win-x64" }, @{ Architecture = "ARM64"; Rid = "win-arm64" })) {
            $architecture = $target.Architecture
            $rid = $target.Rid
            $packageDirectory = Join-Path $env:RUNNER_TEMP "Schoology-MSIX-$rid"
            if (Test-Path $packageDirectory) { Remove-Item $packageDirectory -Recurse -Force }
            New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

            Write-Host "Building packaged $architecture application..."
            & msbuild $project /restore /t:Build "/p:Configuration=Release" "/p:Platform=$architecture" "/p:RuntimeIdentifier=$rid" "/p:WindowsPackageType=MSIX" "/p:WindowsAppSDKSelfContained=true" "/p:SelfContained=true" "/p:GenerateAppxPackageOnBuild=true" "/p:AppxBundle=Never" "/p:UapAppxPackageBuildMode=SideloadOnly" "/p:AppxPackageSigningEnabled=true" "/p:PackageCertificateKeyFile=$pfx" "/p:PackageCertificatePassword=$password" "/p:AppxPackageDir=$packageDirectory\"
            if ($LASTEXITCODE -ne 0) { throw "MSIX build failed for $architecture (exit code $LASTEXITCODE)." }

            $package = Get-ChildItem -Path $packageDirectory -Recurse -Filter "*.msix" -File | Select-Object -First 1
            if (!$package) { throw "MSBuild completed without producing an MSIX for $architecture." }
            Copy-Item -LiteralPath $package.FullName -Destination (Join-Path $output "Schoology-WinUI-$rid.msix") -Force
            Write-Host "Created $($package.Name) for $architecture."
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw "Windows SDK SignTool was not found; cannot verify the MSIX signatures." }
          Get-ChildItem -Path $output -Filter "*.msix" | ForEach-Object {
            & $signtool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed: $($_.Name)" }
          }
          Get-ChildItem -Path $output -File | ForEach-Object { Write-Host "Artifact: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload MSIX packages and publisher certificate
        uses: actions/upload-artifact@v5
        with:
          name: Schoology-WinUI-MSIX
          path: msix-output/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned Schoology release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Schoology.WinUI/Schoology.WinUI.csproj").findtext(".//Version"))')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          selected = []
          for section in text.split("## [")[1:]:
              heading, separator, remainder = section.partition("]")
              if separator and heading == version:
                  selected.append("## [" + heading + "]" + remainder)
          if not selected:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected).strip() + "\n", encoding="utf-8")
          PY
      - name: Download MSIX artifacts
        uses: actions/download-artifact@v5
        with:
          name: Schoology-WinUI-MSIX
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' packages < <(find release-assets -type f \( -name '*.msix' -o -name '*.cer' \) -print0)
          if [ "${#packages[@]}" -lt 3 ]; then
            echo "Expected x64 and ARM64 MSIX packages plus the publisher certificate." >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --target main
          fi
          gh release upload "$VERSION" "${packages[@]}" --clobber
