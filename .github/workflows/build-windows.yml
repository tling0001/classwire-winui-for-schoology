name: Build Schoology WinUI 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and sign MSIX packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          winget install --id Microsoft.WinAppCli --exact --silent --accept-package-agreements --accept-source-agreements
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path', 'User')
          $winapp = Get-Command winapp -ErrorAction SilentlyContinue
          if (!$winapp) { throw "WinApp CLI was installed but its command alias is not available on PATH." }
          winapp --version

      - name: Generate matching MSIX signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:GITHUB_WORKSPACE
          try {
            winapp cert generate --manifest .\Schoology.WinUI\Package.appxmanifest
            if ($LASTEXITCODE -ne 0) { throw "WinApp CLI could not generate a signing certificate." }
            $pfxFile = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "devcert.pfx" -File |
              Select-Object -First 1
            if (!$pfxFile) { throw "WinApp CLI did not create its development certificate." }
            $pfx = $pfxFile.FullName
            $password = ConvertTo-SecureString "password" -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\CurrentUser\My" -Password $password
            if (!$certificate) { throw "Could not import the generated signing certificate." }
            New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE "msix-output") -Force | Out-Null
            Export-Certificate -Cert $certificate -FilePath (Join-Path $env:GITHUB_WORKSPACE "msix-output\Schoology-MSIX-Signing.cer") | Out-Null
          }
          finally { Pop-Location }

      - name: Package x64 and ARM64 MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:GITHUB_WORKSPACE "Schoology.WinUI\Schoology.WinUI.csproj"
          $projectDirectory = Split-Path -Parent $project
          $pfxFile = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "devcert.pfx" -File |
            Select-Object -First 1
          if (!$pfxFile) { throw "The generated MSIX signing certificate is missing." }
          $pfx = $pfxFile.FullName
          $output = Join-Path $env:GITHUB_WORKSPACE "msix-output"

          foreach ($target in @(@{ Architecture = "x64"; Rid = "win-x64" }, @{ Architecture = "arm64"; Rid = "win-arm64" })) {
            $architecture = $target.Architecture
            $rid = $target.Rid

            # Remove only package outputs from the previous architecture so the
            # artifact discovered below must have been produced by this invocation.
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(".msix", ".msixbundle") -and
                !$_.FullName.StartsWith($output, [StringComparison]::OrdinalIgnoreCase)
              } |
              Remove-Item -Force

            Write-Host "Packaging Schoology for $architecture..."
            Push-Location $env:GITHUB_WORKSPACE
            try {
              winapp package $project --arch $architecture --cert $pfx --self-contained
              if ($LASTEXITCODE -ne 0) { throw "WinApp CLI packaging failed for $architecture." }
            }
            finally { Pop-Location }

            $package = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(".msix", ".msixbundle") -and
                !$_.FullName.StartsWith($output, [StringComparison]::OrdinalIgnoreCase)
              } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
            if (!$package) {
              Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "AppPackages|Packages|publish" } |
                ForEach-Object { Write-Host "Package output directory: $($_.FullName)" }
              throw "WinApp CLI completed without producing an MSIX for $architecture."
            }

            $destination = Join-Path $output "Schoology-WinUI-$rid$($package.Extension)"
            Copy-Item -LiteralPath $package.FullName -Destination $destination -Force
            Write-Host "Created package: $($package.FullName)"
            Write-Host "Release artifact: $destination"
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw "Windows SDK SignTool was not found; cannot verify the MSIX signatures." }
          Get-ChildItem -Path $output -Filter "*.msix" | ForEach-Object {
            & $signtool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed: $($_.Name)" }
          }
          Get-ChildItem -Path $output -File | ForEach-Object { Write-Host "Artifact: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload MSIX packages and publisher certificate
        uses: actions/upload-artifact@v5
        with:
          name: Schoology-WinUI-MSIX
          path: msix-output/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned Schoology release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Schoology.WinUI/Schoology.WinUI.csproj").findtext(".//Version"))')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          selected = []
          for section in text.split("## [")[1:]:
              heading, separator, remainder = section.partition("]")
              if separator and heading == version:
                  selected.append("## [" + heading + "]" + remainder)
          if not selected:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected).strip() + "\n", encoding="utf-8")
          PY
      - name: Download MSIX artifacts
        uses: actions/download-artifact@v5
        with:
          name: Schoology-WinUI-MSIX
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' packages < <(find release-assets -type f \( -name '*.msix' -o -name '*.msixbundle' -o -name '*.cer' \) -print0)
          if [ "${#packages[@]}" -lt 3 ]; then
            echo "Expected x64 and ARM64 MSIX packages plus the publisher certificate." >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --target main
          fi
          gh release upload "$VERSION" "${packages[@]}" --clobber
